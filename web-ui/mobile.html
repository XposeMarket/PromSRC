<!doctype html>
<html lang="en" data-theme="dark" data-skin="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prometheus">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/Prometheus.png">
  <link rel="stylesheet" href="/src/styles/mobile.css">
  <title>Prometheus</title>
  <script src="/vendor/jsqr/jsQR.js" defer></script>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#f7f7f8}
    #mobile-root:empty{min-height:100dvh;background:#000}
    .pm-mobile-startup{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;font:15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#d7d7dc}
    .pm-mobile-startup button{margin-top:18px;padding:10px 18px;border:1px solid #777;border-radius:22px;background:#242428;color:#fff;font:inherit}
  </style>
</head>
<body class="pm-mobile-active pm-mobile-document-scroll">
  <div id="mobile-root" aria-live="polite"></div>
  <script>
    window.__PROM_SHOULD_BOOT_MOBILE = () => true;
    window.__PROM_MOBILE_ROUTER_READY = Promise.resolve(null);
    try { localStorage.setItem('pm_force_mobile', '1'); } catch {}

    // This runs before the module graph. An installed PWA can otherwise stay
    // completely black if an old service worker stalls a script request.
    const mobileBootRoot = document.getElementById('mobile-root');
    mobileBootRoot.innerHTML = '<div class="pm-mobile-startup" role="status">Loading Prometheus…</div>';
    async function repairMobileBoot() {
      const briefly = (promise) => Promise.race([
        Promise.resolve(promise),
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]);
      try {
        const registration = await briefly(navigator.serviceWorker?.getRegistration?.(location.href));
        if (registration) await briefly(registration.unregister());
      } catch {}
      try {
        const keys = await briefly(caches.keys());
        if (keys) await briefly(Promise.all(keys.filter((key) => key.startsWith('prometheus-')).map((key) => caches.delete(key))));
      } catch {}
      const url = new URL(location.href);
      url.searchParams.set('pm_recover', String(Date.now()));
      location.replace(url.href);
    }
    setTimeout(() => {
      if (mobileBootRoot.querySelector('.pm-app, .pm-mobile-boot-error')) return;
      let retried = false;
      try {
        const lastRetry = Number(sessionStorage.getItem('pm_mobile_boot_repair_at') || 0);
        retried = lastRetry > Date.now() - 60000;
        if (!retried) sessionStorage.setItem('pm_mobile_boot_repair_at', String(Date.now()));
      } catch {}
      if (!retried) {
        mobileBootRoot.innerHTML = '<div class="pm-mobile-startup" role="status">Refreshing Prometheus…</div>';
        repairMobileBoot();
        return;
      }
      mobileBootRoot.innerHTML = '<div class="pm-mobile-startup"><div>Prometheus could not finish loading.<br><button type="button" id="pm-mobile-startup-repair">Repair app cache</button></div></div>';
      document.getElementById('pm-mobile-startup-repair')?.addEventListener('click', repairMobileBoot);
    }, 12000);
  </script>
  <script type="module" src="/src/mobile/mobile-entry.js"></script>
</body>
</html>
