<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 6 Browser Fixture — Mock CAPTCHA</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; color: #172033; }
    main { width: min(620px, calc(100% - 32px)); padding: 28px; border-radius: 18px; background: white; box-shadow: 0 12px 40px #18234a22; }
    label, legend { font-weight: 650; }
    input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 12px; border: 1px solid #b8c0d9; border-radius: 9px; font-size: 16px; }
    button { padding: 11px 16px; border: 0; border-radius: 9px; background: #4255d4; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { background: #a8afc9; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: end; margin-top: 18px; }
    .row > label { flex: 1; }
    fieldset { margin: 24px 0 0; padding: 16px; border: 1px solid #c7cde1; border-radius: 12px; }
    #mockCaptcha { margin-top: 10px; background: #344054; }
    #mockCaptcha[aria-checked="true"] { background: #1d7a4b; }
    #status { min-height: 24px; margin: 18px 0 0; }
    #success { margin-top: 18px; padding: 14px; border-radius: 10px; background: #e2f7ea; color: #155d38; }
    .hidden { display: none; }
    code { background: #f1f3fa; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main data-testid="browser-fixture">
    <h1>Deterministic Browser Fixture</h1>
    <p>Local-only interaction test. The CAPTCHA below is a mock checkbox, not an anti-bot challenge.</p>
    <div class="row">
      <label for="query">Search query
        <input id="query" name="query" autocomplete="off" placeholder="Type a query">
      </label>
      <button id="searchButton" type="button">Search</button>
    </div>
    <p id="searchResult" aria-live="polite">Search has not run.</p>
    <fieldset>
      <legend>Verification</legend>
      <button id="mockCaptcha" type="button" role="checkbox" aria-checked="false" data-testid="mock-captcha">I’m not a robot (mock)</button>
      <p id="captchaStatus" aria-live="polite">Mock verification pending.</p>
    </fieldset>
    <button id="continueButton" type="button" disabled>Continue</button>
    <p id="status" aria-live="polite">Complete the search and mock verification.</p>
    <div id="success" class="hidden" data-testid="fixture-success">Fixture complete: browser interaction verified.</div>
  </main>
  <script>
    const state = { query: '', searched: false, mockCaptcha: false, continued: false };
    const query = document.querySelector('#query');
    const searchButton = document.querySelector('#searchButton');
    const searchResult = document.querySelector('#searchResult');
    const mockCaptcha = document.querySelector('#mockCaptcha');
    const captchaStatus = document.querySelector('#captchaStatus');
    const continueButton = document.querySelector('#continueButton');
    const status = document.querySelector('#status');
    const success = document.querySelector('#success');
    function sync() {
      continueButton.disabled = !(state.searched && state.mockCaptcha);
      window.__fixtureState = { ...state };
    }
    query.addEventListener('input', () => { state.query = query.value; sync(); });
    searchButton.addEventListener('click', () => {
      state.searched = state.query.trim().length > 0;
      searchResult.textContent = state.searched
        ? `Search result for “${state.query.trim()}”: ready.`
        : 'Enter a query before searching.';
      status.textContent = state.searched ? 'Search complete; pass the mock verification.' : 'A query is required.';
      sync();
    });
    mockCaptcha.addEventListener('click', () => {
      state.mockCaptcha = !state.mockCaptcha;
      mockCaptcha.setAttribute('aria-checked', String(state.mockCaptcha));
      captchaStatus.textContent = state.mockCaptcha ? 'Mock verification complete.' : 'Mock verification pending.';
      status.textContent = state.mockCaptcha ? 'Mock verification complete; continue when ready.' : 'Complete the search and mock verification.';
      sync();
    });
    continueButton.addEventListener('click', () => {
      if (continueButton.disabled) return;
      state.continued = true;
      status.textContent = 'All deterministic checks passed.';
      success.classList.remove('hidden');
      sync();
    });
    sync();
  </script>
</body>
</html>
