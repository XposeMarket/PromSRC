name: Temporary AST-safe Approval Card extraction

on:
  push:
    branches:
      - agent/chat-approval-card
    paths:
      - .github/workflows/tmp-chat-approval-card-ast.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-approval-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: AST-extract Approval Card ownership
        run: node scripts/refactor-chat-approval-card-ast.mjs
      - name: Verify Approval Card component
        run: node scripts/test-chat-approval-card.mjs
      - name: Commit transformed source
        run: |
          rm scripts/refactor-chat-approval-card-ast.mjs
          rm .github/workflows/tmp-chat-approval-card-ast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): extract Approval Card component"
          git push origin HEAD:agent/chat-approval-card
