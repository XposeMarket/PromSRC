name: Apply storage layout activation patch

on:
  push:
    branches:
      - refactor/storage-layout-activation
    paths:
      - 'scripts/apply-storage-layout-activation.mjs'
      - '.github/workflows/storage-layout-activation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storage-layout-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact activation patch
        run: node scripts/apply-storage-layout-activation.mjs
      - name: Commit activation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: route desktop runtime state through layout v2"
          git push origin HEAD:refactor/storage-layout-activation
