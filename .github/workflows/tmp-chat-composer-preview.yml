name: Temporary desktop composer preview extraction

on:
  push:
    branches:
      - agent/chat-desktop-composer-component
    paths:
      - .github/workflows/tmp-chat-composer-preview.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-desktop-composer-component
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract composer functions
        run: node scripts/extract-desktop-composer-preview.mjs
      - name: Commit preview module
        run: |
          rm scripts/extract-desktop-composer-preview.mjs
          rm .github/workflows/tmp-chat-composer-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): stage desktop composer component"
          git push origin HEAD:agent/chat-desktop-composer-component
