name: Temporary Brain Cognition Integrity Verification

on:
  push:
    branches:
      - review/brain-cognition-integrity

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply audited fixes
        run: python3 scripts/tmp-brain-cognition-integrity-patch.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Verify Thought activity package
        run: npm run test:activity-package
      - name: Verify Thought/Dream continuity
        run: npx tsx src/gateway/brain/brain-continuity.regression.ts
      - name: Verify cognition integrity contracts
        run: npx tsx src/gateway/brain/brain-cognition-integrity.regression.ts
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-brain-cognition-integrity-patch.py .github/workflows/tmp-brain-cognition-integrity.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Brain activity and continuity integrity' -m 'Preserve exact Thought activity coverage boundaries, make continuation artifacts idempotent across reruns, and fail malformed/stale Thought and Dream continuity sidecars instead of silently replacing them with empty successful packets.'
          git push origin HEAD:review/brain-cognition-integrity
