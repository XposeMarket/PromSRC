name: Temporary Public UI Cache Contract Verification

on:
  push:
    branches:
      - review/fix-public-ui-cache-contract

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-fix-public-ui-cache-contract.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Service worker syntax
        run: |
          node --check web-ui/service-worker.js
          node --check generated/public-web-ui/service-worker.js
      - name: Cache contract regression
        run: node scripts/test-public-ui-cache-contract.mjs
      - name: Generated web UI sync
        run: npm run check:web-ui
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-fix-public-ui-cache-contract.py .github/workflows/tmp-public-ui-cache-contract.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add src/gateway/core/server.ts web-ui/service-worker.js generated/public-web-ui/service-worker.js scripts/test-public-ui-cache-contract.mjs
          git commit -m 'Fix public UI cache freshness' -m 'Revalidate stable generated static module URLs, force service-worker network-first requests through HTTP revalidation, and route pre-cached /static modules through CacheStorage fallback for offline mobile use.'
          git push origin HEAD:review/fix-public-ui-cache-contract
