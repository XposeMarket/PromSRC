name: Mobile V2 PWA sync once

on:
  push:
    branches:
      - mobile-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v2-foundation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire V2 root PWA files into public build contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          prepare = Path('scripts/prepare-public-build.js')
          text = prepare.read_text(encoding='utf-8')
          text = text.replace(
              "for (const name of ['manifest.webmanifest', 'service-worker.js']) {",
              "for (const name of ['manifest.webmanifest', 'service-worker.js', 'manifest-v2.webmanifest', 'service-worker-v2.js']) {",
          )
          text = text.replace(
              "const ROOT_LEVEL_FILES = ['manifest.webmanifest', 'service-worker.js'];",
              "const ROOT_LEVEL_FILES = ['manifest.webmanifest', 'service-worker.js', 'manifest-v2.webmanifest', 'service-worker-v2.js'];",
          )
          prepare.write_text(text, encoding='utf-8')

          checker = Path('scripts/check-public-web-ui-sync.js')
          text = checker.read_text(encoding='utf-8')
          text = text.replace(
              "const ROOT_LEVEL_FILES = ['manifest.webmanifest'];",
              "const ROOT_LEVEL_FILES = ['manifest.webmanifest', 'manifest-v2.webmanifest', 'service-worker-v2.js'];",
          )
          checker.write_text(text, encoding='utf-8')

          builder = Path('scripts/build-web-ui-production.mjs')
          text = builder.read_text(encoding='utf-8')
          old = "return relative !== 'mobile-v2.html' && !relative.startsWith('src/mobile-v2/');"
          new = "return relative !== 'mobile-v2.html' && relative !== 'manifest-v2.webmanifest' && relative !== 'service-worker-v2.js' && !relative.startsWith('src/mobile-v2/');"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not locate Mobile V2 digest exclusion')
          builder.write_text(text, encoding='utf-8')

          test = Path('scripts/test-mobile-v2-foundation.mjs')
          text = test.read_text(encoding='utf-8')
          anchor = "const gatewayServer = read('src/gateway/core/server.ts');"
          insert = """const gatewayServer = read('src/gateway/core/server.ts');
          const pwa = read('web-ui/src/mobile-v2/core/pwa.js');
          const theme = read('web-ui/src/mobile-v2/core/theme.js');
          const haptics = read('web-ui/src/mobile-v2/ui/haptics.js');
          const manifestV2 = read('web-ui/manifest-v2.webmanifest');
          const serviceWorkerV2 = read('web-ui/service-worker-v2.js');
          const productionBuilder = read('scripts/build-web-ui-production.mjs');"""
          if "const pwa = read('web-ui/src/mobile-v2/core/pwa.js');" not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate V2 test source declarations')
              text = text.replace(anchor, insert, 1)
          before = "const allV2JavaScript = walk('web-ui/src/mobile-v2').filter((file) => file.endsWith('.js'));"
          assertions = """assert.match(html, /manifest-v2\\.webmanifest/);
          assert.match(pwa, /service-worker-v2\\.js/);
          assert.match(pwa, /scope:\\s*['\"]\\/mobile-v2\\//);
          assert.match(theme, /Prometheus One/);
          assert.match(theme, /base:\\s*['\"]light['\"]/);
          assert.match(haptics, /input\\.setAttribute\\(['\"]switch['\"]/);
          assert.match(manifestV2, /\"id\"\\s*:\\s*\"\\/mobile-v2\\/\"/);
          assert.match(manifestV2, /\"start_url\"\\s*:\\s*\"\\/mobile-v2\\/chat\"/);
          assert.match(serviceWorkerV2, /prometheus-v2-static/);
          assert.match(serviceWorkerV2, /prometheus-v2-runtime/);
          assert.match(productionBuilder, /manifest-v2\\.webmanifest/);
          assert.match(productionBuilder, /service-worker-v2\\.js/);

          const allV2JavaScript = walk('web-ui/src/mobile-v2').filter((file) => file.endsWith('.js'));"""
          if 'assert.match(manifestV2' not in text:
              if before not in text:
                  raise SystemExit('Could not locate V2 test assertion insertion point')
              text = text.replace(before, assertions, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync public web UI
        run: npm run sync:web-ui

      - name: Verify Mobile V2 contract
        run: node scripts/test-mobile-v2-foundation.mjs

      - name: Commit build contracts and generated V2 PWA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare-public-build.js scripts/check-public-web-ui-sync.js scripts/build-web-ui-production.mjs scripts/test-mobile-v2-foundation.mjs generated/public-web-ui
          if git diff --cached --quiet; then
            echo "V2 PWA public sync already current."
            exit 0
          fi
          git commit -m "build(mobile-v2): ship isolated V2 PWA assets"
          git push origin HEAD:mobile-v2-foundation
