name: Temporary internal-watch contract verification

on:
  push:
    branches:
      - review/update-internal-watch-routing-contract

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native backend dependencies
        run: npm rebuild better-sqlite3 node-pty
      - name: Build backend
        run: npm run build:backend
      - name: Verify automation static/runtime contract
        run: node scripts/test-automation-runtime-contract.mjs
      - name: Verify internal-watch restart recovery
        run: npx tsx src/gateway/internal-watch/internal-watch-restart-recovery.regression.ts
      - name: Verify internal-watch policy
        run: npx tsx src/gateway/internal-watch/internal-watch-policy.regression.ts
