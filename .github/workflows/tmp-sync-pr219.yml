name: Temporary PR219 generated sync

on:
  push:
    branches:
      - fix/mobile-gateway-qr-decoder

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-gateway-qr-decoder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync:web-ui
      - name: Commit deterministic generated output and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-sync-pr219.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/public-web-ui .github/workflows/tmp-sync-pr219.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync generated QR fix output"
          git push origin HEAD:fix/mobile-gateway-qr-decoder
