name: Temporary Memory Embedding Provider Cache Verification

on:
  push:
    branches:
      - review/refresh-memory-embedding-providers

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-refresh-memory-embedding-providers.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Embedding provider cache contract
        run: node scripts/test-memory-embedding-provider-cache-contract.mjs
      - name: Memory index regression
        run: npx tsx src/gateway/memory-index/memory-index.regression.ts
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-refresh-memory-embedding-providers.py .github/workflows/tmp-memory-embedding-provider-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh memory embedding providers from config' -m 'Stop caching provider descriptors that capture embedding endpoint, model, and secret-reference settings for the gateway lifetime; rebuild lightweight descriptors from current config on resolution.'
          git push origin HEAD:review/refresh-memory-embedding-providers
