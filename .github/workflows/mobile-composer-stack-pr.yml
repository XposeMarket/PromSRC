name: Mobile composer stack PR verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check loader
        run: |
          node --check web-ui/src/mobile/mobile-data.js
          node --check generated/public-web-ui/static/mobile/mobile-data.js
      - name: Verify composer stack contract
        run: node scripts/test-mobile-composer-stack-glass.mjs
      - name: Verify existing liquid glass contract
        run: node scripts/test-mobile-liquid-glass-neutral.mjs
      - name: Verify generated parity
        run: |
          cmp web-ui/src/mobile/mobile-data.js generated/public-web-ui/static/mobile/mobile-data.js
          cmp web-ui/src/styles/mobile-composer-stack.css generated/public-web-ui/static/styles/mobile-composer-stack.css
