name: Temporary Atomic Memory Project Context Verification

on:
  push:
    branches:
      - review/atomic-memory-project-context

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply audited fix
        shell: bash
        run: |
          set +e
          output="$(python3 scripts/tmp-atomic-memory-project-context-patch.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "memory atom regression insertion anchor mismatch" <<<"$output"
          python3 scripts/tmp-atomic-memory-project-context-finish.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Verify atomic durable-memory retrieval
        run: npx tsx src/gateway/memory-index/memory-atoms.regression.ts
      - name: Verify prompt cache/context assembly
        run: npm run test:prompt-cache
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-atomic-memory-project-context-patch.py scripts/tmp-atomic-memory-project-context-finish.py .github/workflows/tmp-atomic-memory-project-context.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Keep project context from diluting atomic memory recall' -m 'Score lexical durable-memory relevance against the user turn only while retaining project context as positive-only entity/section disambiguation. Add regression coverage for large unrelated project packets.'
          git push origin HEAD:review/atomic-memory-project-context
