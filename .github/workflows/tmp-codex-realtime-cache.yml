name: Temporary Codex Realtime Cache Verification

on:
  push:
    branches:
      - review/clear-dead-codex-realtime-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-clear-dead-codex-realtime-cache.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Realtime cache cleanup regression
        run: npx tsx src/gateway/realtime/codex-app-server-bridge.regression.ts
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-clear-dead-codex-realtime-cache.py .github/workflows/tmp-codex-realtime-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add src/gateway/realtime/codex-app-server-bridge.ts src/gateway/realtime/codex-app-server-bridge.regression.ts
          git commit -m 'Clear dead Codex realtime cache state' -m 'Discard pre-session event tails after failed realtime starts and clear all process-bound realtime sessions, waiters, and pending event state on app-server death or shutdown so dead thread IDs cannot survive a worker restart.'
          git push origin HEAD:review/clear-dead-codex-realtime-cache
