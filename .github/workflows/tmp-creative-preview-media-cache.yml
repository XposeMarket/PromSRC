name: Temporary Creative Preview Media Cache Verification

on:
  push:
    branches:
      - review/bound-creative-preview-media-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: |
          python3 scripts/tmp-bound-creative-preview-media-cache.py
          python3 scripts/tmp-wire-creative-cache-teardown.py
      - name: JavaScript syntax
        run: |
          node --check web-ui/src/components/creative/editor/preview/renderer.js
          node --check web-ui/src/components/creative/editor/index.js
      - name: Creative media cache contract
        run: node scripts/test-creative-preview-media-cache.mjs
      - name: Sync generated web UI
        run: npm run sync:web-ui
      - name: Generated web UI check
        run: npm run check:web-ui
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-bound-creative-preview-media-cache.py scripts/tmp-wire-creative-cache-teardown.py .github/workflows/tmp-creative-preview-media-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Bound creative preview media caches' -m 'Use bounded LRU caches for preview images/videos, release evicted video resources, and clear cached media when the video editor unmounts so long editing sessions cannot retain every previewed asset.'
          git push origin HEAD:review/bound-creative-preview-media-cache
