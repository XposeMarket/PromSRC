name: Temporary Question controller audit worker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/chat-question-interactions-worker
          fetch-depth: 1
      - name: List Question-related ChatPage functions
        run: grep -nE '^function .*([Qq]uestion)' web-ui/src/pages/ChatPage.js || true
