name: Temporary Question contracts extraction worker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/chat-question-contracts-worker
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Extract Question contracts
        run: node scripts/refactor-chat-question-contracts.mjs
      - name: Syntax-check extracted contract module
        run: node --check web-ui/src/features/chat/questions/contracts.js
      - name: Commit worker extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(chat): extract Question validation and event contracts"
          git push origin HEAD:tmp/chat-question-contracts-worker
