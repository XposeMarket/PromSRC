name: Pull request regression checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  # Regression checks only read the repository. No step pushes, comments or
  # writes releases, so the workflow token is read-only (least privilege).
  contents: read

concurrency:
  group: pr-regression-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The regression list lives in scripts/ci/regressions.json (add tests there, not here).
  # scripts/ci/run-regressions.mjs splits it into balanced shards that run in parallel and
  # reports every failure of a shard in one run. To change the shard count, edit the matrix.
  regressions:
    name: regressions (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm's download cache: used by npm ci on a dependency change and by the
          # packed-consumer (embed) regression's independent npm install.
          cache: npm
      - name: Restore installed dependencies (keyed by package-lock.json)
        id: modules
        uses: actions/cache/restore@v4
        with:
          # Every directory npm ci writes: local file: packages (packages/claude-driver)
          # keep their own dependencies next to them. test:ci-runner checks this list
          # against package-lock.json.
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies without package lifecycle scripts and build node-pty
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild node-pty --ignore-scripts=false
      - name: Save installed dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        # Saved before any regression runs, so test side effects never enter the cache.
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Runner images already ship Chromium's system libraries; only the browser is downloaded.
        run: npx playwright install chromium
      - name: Build public web UI bundle and verify committed outputs are current
        # generated/public-web-ui is untracked build output; sync:web-ui ends with check:web-ui.
        run: |
          npm run sync:web-ui
          git diff --exit-code
      - name: Run regression shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node scripts/ci/run-regressions.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Verify regressions left tracked files unchanged
        run: git diff --exit-code --stat

  # Required status check (branch protection requires "verify"). A skipped required job
  # would count as passing, so this always runs and fails unless every shard succeeded.
  verify:
    if: ${{ always() }}
    needs: regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every regression shard to pass
        env:
          SHARDS_RESULT: ${{ needs.regressions.result }}
        run: |
          echo "Regression shards finished: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error title=Regression shards::One or more regression shards did not pass ($SHARDS_RESULT). Open the failing 'regressions (n/N)' job."
            exit 1
          fi
