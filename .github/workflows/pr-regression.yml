name: Temporary Question interaction extraction worker

on:
  push:
    branches:
      - tmp/chat-question-interactions-worker

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/chat-question-interactions-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract Question interaction helpers
        run: node scripts/refactor-chat-question-interactions.mjs
      - name: Syntax-check extracted modules
        run: |
          node --check web-ui/src/features/chat/questions/interactions.js
          node --check web-ui/src/features/chat/rendering/css-escape.js
      - name: Restore normal workflow and remove worker script
        run: |
          git show b01ec4721ec8e4a20214425864b02d05995f9930:.github/workflows/pr-regression.yml > .github/workflows/pr-regression.yml
          rm scripts/refactor-chat-question-interactions.mjs
      - name: Commit clean extraction tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(chat): extract Question interaction helpers"
          git push origin HEAD:tmp/chat-question-interactions-worker
