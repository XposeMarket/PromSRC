name: Pull request regression checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/token-window-native-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply and verify PR171 runtime repair
        run: |
          python scripts/temp-apply-pr171-runtime.py
          npm run sync:web-ui
          node scripts/test-token-window-native-context.mjs
          npm run test:context-window
          npx tsc --noEmit
          git config user.name "prometheus-context-bot"
          git config user.email "prometheus-context-bot@users.noreply.github.com"
          git add src/gateway/session.ts src/gateway/routes/chat.router.ts web-ui/src/mobile/mobile-settings.js generated/public-web-ui/static/mobile/mobile-settings.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(context): use model token window for active history"
            git push origin HEAD:fix/token-window-native-context
          fi
      - name: Type-check backend
        run: npx tsc --noEmit
      - name: Verify proposal approval durability
        run: |
          npx tsx src/gateway/proposals/proposal-approval-flow.regression.ts
          node scripts/test-proposal-approval-flow-ui.mjs
      - name: Verify hybrid atomic durable-memory retrieval
        run: |
          npx tsx src/gateway/memory-index/memory-atoms-hybrid.regression.ts
          npx tsx src/gateway/memory-index/memory-atoms-real-corpus.stress.ts
          npx tsx src/gateway/agents-runtime/capabilities/memory-wrapper.regression.ts
      - name: Verify connector/plugin tool-surface parity
        run: npx tsx scripts/verify-extensions.ts && npx tsx src/extensions/tool-contracts.regression.ts
      - name: Verify natural-language tool activation
        run: npm run test:extension-activation && npm run test:tool-category-routing && npx tsx src/runtime/tool-category-prompt-signals.regression.ts
      - name: Verify deterministic composite workflows
        run: npx tsx src/gateway/tools/composite-tools.regression.ts
      - name: Verify provider-neutral connector policy
        run: npx tsx src/gateway/connector-tool-capabilities.regression.ts && npx tsx src/extensions/runtime-registry.performance.regression.ts
      - name: Verify public web source sync
        run: npm run check:web-ui
      - name: Verify desktop multi-chat contract
        run: node scripts/test-desktop-chat-layout-contract.mjs
      - name: Verify context window contract
        run: npm run test:context-window
      - name: Verify Prom Bot persistent-agent stack
        run: |
          node scripts/test-desktop-prom-bot.mjs
          node scripts/test-desktop-prom-bot-roster.mjs
          node scripts/test-desktop-prom-bot-collab.mjs
          node scripts/test-prom-bot-team-flow.mjs
          node scripts/test-bot-creation-contract.mjs
          node scripts/test-prom-bot-persistent-agent-hardening.mjs
      - name: Verify Prometheus chat link routing
        run: npm run test:link-routing
      - name: Verify web UI restart reload dedupe
        run: npm run test:web-ui-refresh-loop
      - name: Verify live mobile liquid glass material
        run: node scripts/test-mobile-liquid-glass-live-demo-material.mjs
      - name: Verify web UI architecture guardrails
        run: node scripts/test-web-ui-architecture-guardrails.mjs
      - name: Verify shared chat core contract
        run: node scripts/test-chat-core-contract.mjs
      - name: Verify mobile multi-gateway contract
        run: node scripts/test-mobile-gateway-contract.mjs
      - name: Verify remote mobile gateway JSON mutations
        run: node scripts/test-mobile-gateway-json-mutations.mjs
      - name: Verify stale mobile chat gateway recovery
        run: node scripts/test-mobile-stale-gateway-route-recovery.mjs
      - name: Verify mobile chat recovery
        run: node scripts/test-mobile-chat-recovery.mjs
      - name: Verify mobile voice/media contract
        run: node scripts/test-mobile-voice-media-contract.mjs
      - name: Verify Electron gateway relay
        run: node scripts/test-electron-gateway-relay.mjs
      - name: Verify Electron security boundary
        run: node scripts/test-electron-security-boundary.mjs
      - name: Verify plugins page contract
        run: node scripts/test-plugins-page-contract.mjs
      - name: Verify Hub goals contract
        run: node scripts/test-hub-goals-contract.mjs
      - name: Verify design preview contract
        run: node scripts/test-design-preview-contract.mjs
      - name: Verify chat error presentation
        run: node scripts/test-chat-error-presentation.mjs
      - name: Verify desktop reasoning summary streaming
        run: node scripts/test-desktop-reasoning-summary-stream.mjs
