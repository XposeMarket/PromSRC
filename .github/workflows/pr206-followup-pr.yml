name: Build mobile voice follow-up

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-voice-motion-and-rtc-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply focused source changes
        run: node .github/pr206-followup-patch.cjs
      - name: Verify focused contracts
        run: |
          node --check web-ui/src/mobile/mobile-voice-motion-orb.js
          node scripts/test-mobile-voice-motion-orb.mjs
          node scripts/test-mobile-realtime-transient-disconnect.mjs
          node scripts/test-mobile-voice-media-contract.mjs
      - name: Regenerate tracked public web output
        run: npm run sync:web-ui
      - name: Verify generated output
        run: npm run check:web-ui
      - name: Commit final product diff
        shell: bash
        run: |
          rm -f .github/workflows/pr206-followup-voice-fix.yml
          rm -f .github/workflows/pr206-followup-pr.yml
          rm -f .github/pr206-followup-patch.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mobile): stabilize voice motion and realtime connection"
          git push origin HEAD:fix/mobile-voice-motion-and-rtc-stability
