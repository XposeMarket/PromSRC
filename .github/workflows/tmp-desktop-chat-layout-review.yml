name: Temporary Desktop Chat Layout Verification

on:
  push:
    branches:
      - review/align-desktop-chat-and-minimized-sources

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[layout-audit-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/align-desktop-chat-and-minimized-sources
          fetch-depth: 0

      - name: Apply scoped desktop layout fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'web-ui/src/styles/base.css',
              '  --sidebar-w: 280px;\n  --right-w: 380px;',
              '  --sidebar-w: 280px;\n  --right-w: 380px;\n  /* Compact Sources peek stays visually floating, but its footprint is reserved\n     so chat content never sits underneath it. 324px card + 14px edge + 14px gap. */\n  --sources-minimized-layout-reserve: 352px;',
          )
          replace_once(
              'web-ui/src/styles/base.css',
              '/* The minimized Sources surface is a floating peek. It must not become a\n   second layout column or expose the full right drawer underneath it. */\nbody:not(.pm-mobile-active).sources-minimized-open .workspace > .center-col {\n  margin-right: 0;\n}',
              '/* The minimized Sources surface remains the compact floating peek, but the\n   center column reserves only that peek\'s footprint. This reflows chat without\n   opening or reserving the full right drawer underneath it. */\nbody:not(.pm-mobile-active).sources-minimized-open .workspace > .center-col {\n  margin-right: var(--sources-minimized-layout-reserve);\n}',
          )

          replace_once(
              'web-ui/src/styles/components.css',
              '#chat-view {\n  position: relative;\n  /* The welcome screen must size against the remaining center column, not the\n     browser viewport when the sidebar and context drawer are both open. */',
              '#chat-view {\n  position: relative;\n  /* Main messages and composer are one responsive conversation column. Keep\n     both edges locked together as sidebars/canvases change the center width. */\n  --chat-content-max-width: 860px;\n  --chat-content-inline-gutter: clamp(20px, 4cqw, 44px);\n  /* The welcome screen must size against the remaining center column, not the\n     browser viewport when the sidebar and context drawer are both open. */',
          )
          replace_once(
              'web-ui/src/styles/components.css',
              '.msg-shell {\n  width: min(860px, calc(100% - 32px));',
              '.msg-shell {\n  width: min(var(--chat-content-max-width), calc(100% - var(--chat-content-inline-gutter) - var(--chat-content-inline-gutter)));',
          )
          replace_once(
              'web-ui/src/styles/components.css',
              '.chat-input-area {\n  position: absolute;\n  bottom: 18px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: min(860px, calc(100% - 40px));',
              '.chat-input-area {\n  position: absolute;\n  bottom: 18px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: min(var(--chat-content-max-width), calc(100% - var(--chat-content-inline-gutter) - var(--chat-content-inline-gutter)));',
          )

          Path('generated/public-web-ui/static/styles/base.css').write_text(Path('web-ui/src/styles/base.css').read_text())
          Path('generated/public-web-ui/static/styles/components.css').write_text(Path('web-ui/src/styles/components.css').read_text())

      - name: Verify layout contract
        run: node scripts/test-desktop-chat-layout-contract.mjs

      - name: Verify generated web UI
        run: npm run check:web-ui

      - name: Verify diff whitespace
        run: git diff --check

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-desktop-chat-layout-review.yml
          git config user.name "Prometheus Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web-ui/src/styles/base.css web-ui/src/styles/components.css \
            generated/public-web-ui/static/styles/base.css generated/public-web-ui/static/styles/components.css \
            scripts/test-desktop-chat-layout-contract.mjs \
            .github/workflows/tmp-desktop-chat-layout-review.yml
          git commit -m "Align desktop chat with Sources layout [layout-audit-final]"
          git push origin HEAD:review/align-desktop-chat-and-minimized-sources
