name: Mobile V2 drawer sync once

on:
  push:
    branches:
      - mobile-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v2-foundation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire V2 drawer parity into shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('web-ui/src/mobile-v2/ui/shell.js')
          text = shell.read_text(encoding='utf-8')
          import_anchor = "import { attachMobileV2HapticGestureSurface, mobileV2Haptic } from './haptics.js';"
          drawer_import = "import { attachMobileV2DrawerParity } from './drawer-parity.js';"
          if drawer_import not in text:
              text = text.replace(import_anchor, import_anchor + "\n" + drawer_import, 1)

          gateway_anchor = "  const gatewayStrip = root.querySelector('[data-v2-gateway-strip]');"
          if 'let drawerParity = null;' not in text:
              text = text.replace(gateway_anchor, gateway_anchor + "\n  let drawerParity = null;", 1)

          old_open = """    if (drawerOpen) {
              refreshSessions();
              refreshGatewayStrip();
            }"""
          new_open = """    if (drawerOpen) {
              refreshSessions()
                .then(() => drawerParity?.refresh())
                .catch(() => drawerParity?.refresh());
              refreshGatewayStrip();
            }"""
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif new_open not in text:
              raise SystemExit('Could not locate drawer-open refresh block')

          attach_anchor = "  requestAnimationFrame(() => {\n    tabbar?.querySelectorAll('.pm-tab').forEach((tab) => tab.style.setProperty('--pm-tab-left-px', `${tab.offsetLeft}px`));"
          attach_code = """  drawerParity = attachMobileV2DrawerParity({
              drawer,
              list,
              gateways,
              navigate: (route) => navigate(route),
              setDrawer,
              showNotice,
              refreshBaseSessions: refreshSessions,
              getBaseSessions: () => sessions,
              getActiveSessionRef: readActiveSessionRef,
            });

          """
          if 'drawerParity = attachMobileV2DrawerParity({' not in text:
              if attach_anchor not in text:
                  raise SystemExit('Could not locate shell parity insertion point')
              text = text.replace(attach_anchor, attach_code + attach_anchor, 1)

          dispose_anchor = "      disposeSlider?.();\n      gateways.removeEventListener('change', refreshStatus);"
          dispose_new = "      disposeSlider?.();\n      drawerParity?.dispose?.();\n      gateways.removeEventListener('change', refreshStatus);"
          if "drawerParity?.dispose?.();" not in text:
              if dispose_anchor not in text:
                  raise SystemExit('Could not locate shell dispose block')
              text = text.replace(dispose_anchor, dispose_new, 1)
          shell.write_text(text, encoding='utf-8')

          drawer = Path('web-ui/src/mobile-v2/ui/drawer-parity.js')
          text = drawer.read_text(encoding='utf-8')
          duplicate = """  drawer.addEventListener('click', (event) => {
              const row = resolveSessionRow(event.target);
              if (!row || drawer.querySelector('.pm-v2-session-sheet')) return;
              const ref = row.dataset.sessionRef;
              if (!ref) return;
              setDrawer?.(false);
              navigate?.(`chat/${encodeURIComponent(ref)}`);
            });

          """
          if duplicate in text:
              text = text.replace(duplicate, '', 1)
          drawer.write_text(text, encoding='utf-8')

          css = Path('web-ui/src/mobile-v2/mobile-v2.css')
          text = css.read_text(encoding='utf-8')
          drawer_import_css = "@import './mobile-v2-drawer.css';"
          if drawer_import_css not in text:
              text = text.replace("@import '../styles/mobile.css';", "@import '../styles/mobile.css';\n" + drawer_import_css, 1)
          css.write_text(text, encoding='utf-8')

          test = Path('scripts/test-mobile-v2-foundation.mjs')
          text = test.read_text(encoding='utf-8')
          assertion_anchor = "assert.match(shell, /Gateway Connections/);"
          assertion = "assert.match(shell, /attachMobileV2DrawerParity/);"
          if assertion not in text:
              text = text.replace(assertion_anchor, assertion_anchor + "\n" + assertion, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check drawer and shell
        run: |
          node --check web-ui/src/mobile-v2/ui/drawer-parity.js
          node --check web-ui/src/mobile-v2/ui/shell.js

      - name: Sync public web UI
        run: npm run sync:web-ui

      - name: Verify Mobile V2 contract
        run: node scripts/test-mobile-v2-foundation.mjs

      - name: Commit drawer parity and generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-ui/src/mobile-v2/ui/shell.js web-ui/src/mobile-v2/ui/drawer-parity.js web-ui/src/mobile-v2/mobile-v2.css scripts/test-mobile-v2-foundation.mjs generated/public-web-ui
          if git diff --cached --quiet; then
            echo "V2 drawer parity already synced."
            exit 0
          fi
          git commit -m "feat(mobile-v2): wire drawer session parity"
          git push origin HEAD:mobile-v2-foundation
