name: Mobile V2 foundation

on:
  pull_request:
    paths:
      - 'web-ui/mobile-v2.html'
      - 'web-ui/src/mobile-v2/**'
      - 'scripts/test-mobile-v2-foundation.mjs'
      - '.github/workflows/mobile-v2-foundation.yml'
  push:
    branches:
      - mobile-v2-foundation
    paths:
      - 'web-ui/mobile-v2.html'
      - 'web-ui/src/mobile-v2/**'
      - 'scripts/test-mobile-v2-foundation.mjs'
      - '.github/workflows/mobile-v2-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Mobile V2 module syntax
        run: |
          node --check web-ui/src/mobile-v2/mobile-v2-entry.js
          node --check web-ui/src/mobile-v2/app/router.js
          node --check web-ui/src/mobile-v2/core/gateway-client.js
          node --check web-ui/src/mobile-v2/core/chat-store.js
          node --check web-ui/src/mobile-v2/ui/icons.js
          node --check web-ui/src/mobile-v2/ui/shell.js
          node --check web-ui/src/mobile-v2/features/chat/chat-page.js
          node --check web-ui/src/mobile-v2/features/placeholder/placeholder-page.js
      - name: Verify V2 isolation and visual contract
        run: node scripts/test-mobile-v2-foundation.mjs
