name: Mobile gateway hardening PR verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'web-ui/src/mobile/mobile-gateway-catalog.js'
      - 'generated/public-web-ui/static/mobile/mobile-gateway-catalog.js'
      - 'scripts/test-mobile-gateway-auth-identity-hardening.mjs'
      - '.github/workflows/mobile-gateway-hardening-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source
        run: node --check web-ui/src/mobile/mobile-gateway-catalog.js
      - name: Run hardening regression
        run: node scripts/test-mobile-gateway-auth-identity-hardening.mjs
      - name: Verify generated source parity
        run: cmp web-ui/src/mobile/mobile-gateway-catalog.js generated/public-web-ui/static/mobile/mobile-gateway-catalog.js
