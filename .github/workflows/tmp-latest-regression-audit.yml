name: Temporary latest regression audit

on:
  push:
    branches:
      - review/latest-regression-audit

permissions:
  contents: read

jobs:
  coding-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build native test dependencies
        run: npm rebuild node-pty better-sqlite3
      - name: Coding context and terminal tracking
        run: npm run test:coding-context

  plugins-path-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plugin tool surface
        run: npm run test:plugin-tool-surface
      - name: Path permissions
        run: npm run test:path-permissions
      - name: Prompt cache
        run: npm run test:prompt-cache
      - name: Goal continuity
        run: npm run test:goal-continuity

  pairing-security-and-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build native backend dependencies
        run: npm rebuild better-sqlite3 node-pty
      - name: Build backend once
        run: npm run build:backend
      - name: Pairing admin boundary
        run: node scripts/test-pairing-admin-boundary.mjs
      - name: Storage boundaries
        run: node scripts/test-storage-boundaries.mjs
      - name: Tool security boundaries
        run: node scripts/test-tool-security-boundaries.mjs
      - name: Connector OAuth contract
        run: node scripts/test-connector-oauth-contract.mjs
      - name: Connection orchestrator
        run: node scripts/test-connection-orchestrator.mjs

  agents-automations-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build native backend dependencies
        run: npm rebuild better-sqlite3 node-pty
      - name: Build backend once
        run: npm run build:backend
      - name: Agent runtime contract
        run: node scripts/test-agent-runtime-contract.mjs
      - name: Automation runtime and internal-watch recovery
        run: node scripts/test-automation-runtime-contract.mjs && npx tsx src/gateway/internal-watch/internal-watch-restart-recovery.regression.ts && npx tsx src/gateway/internal-watch/internal-watch-policy.regression.ts
      - name: Reasoning capabilities
        run: node scripts/test-reasoning-capabilities.mjs
      - name: Main-chat goal restart contracts
        run: node scripts/test-main-chat-goal-restart-contract.mjs && node scripts/test-main-chat-goal-crash-recovery.mjs && node scripts/test-main-chat-goal-steer-contract.mjs

  updater-and-electron-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build native backend dependencies
        run: npm rebuild better-sqlite3 node-pty
      - name: Build backend once
        run: npm run build:backend
      - name: Canonical updater contract
        run: node scripts/test-canonical-updater.mjs
      - name: Electron security boundary
        run: node scripts/test-electron-security-boundary.mjs
      - name: Supervised restart cleanup
        run: node scripts/test-supervised-restart-cleanup.mjs
      - name: Gateway relay
        run: node scripts/test-electron-gateway-relay.mjs
