name: Temporary Desktop Screenshot Cache Verification

on:
  push:
    branches:
      - review/bound-desktop-screenshot-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-bound-desktop-screenshot-cache.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Desktop cache contract
        run: node scripts/test-desktop-cache-contract.mjs
      - name: Desktop state regression
        run: |
          npm run build:backend
          node scripts/test-desktop-state-contract.mjs
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-bound-desktop-screenshot-cache.py .github/workflows/tmp-desktop-screenshot-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add src/gateway/desktop-tools.ts scripts/test-desktop-cache-contract.mjs
          git commit -m 'Bound desktop screenshot session caches' -m 'Expire per-session current/previous desktop screenshot packets with the existing screenshot TTL and cap retained session packets so old desktop chats cannot pin base64 screenshots for the lifetime of the gateway.'
          git push origin HEAD:review/bound-desktop-screenshot-cache
