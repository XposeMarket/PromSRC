name: Temporary desktop composer wiring

on:
  push:
    branches:
      - agent/chat-desktop-composer-component
    paths:
      - .github/workflows/tmp-chat-composer-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-desktop-composer-component
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Wire composer ownership
        run: node scripts/refactor-chat-desktop-composer.mjs
      - name: Verify composer component
        run: node scripts/test-chat-desktop-composer.mjs
      - name: Commit transformed source
        run: |
          rm scripts/refactor-chat-desktop-composer.mjs
          rm .github/workflows/tmp-chat-composer-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): extract desktop composer component"
          git push origin HEAD:agent/chat-desktop-composer-component
