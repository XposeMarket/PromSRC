name: Apply thread context window patch

on:
  push:
    branches:
      - fix/context-window-live-tracking-ui
    paths:
      - scripts/apply-thread-context-window-patch.mjs
      - .github/workflows/apply-thread-context-window-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-window-live-tracking-ui
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/apply-thread-context-window-patch.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-thread-context-window-patch.mjs
          rm .github/workflows/apply-thread-context-window-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(context-window): track full thread context"
          git push origin HEAD:fix/context-window-live-tracking-ui
