name: Apply thread context window patch

on:
  push:
    branches:
      - fix/context-window-live-tracking-ui
    paths:
      - scripts/apply-thread-context-window-patch.mjs
      - .github/workflows/apply-thread-context-window-patch.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-thread-context-window-patch.mjs
      - .github/workflows/apply-thread-context-window-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-window-live-tracking-ui
          fetch-depth: 0
      - name: Repair one-shot patch quoting and source drift
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-thread-context-window-patch.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "const id = `thought:${threadKey}`;": "const id = 'thought:' + threadKey;",
              "label: `Atomic memories (${atomRows.length} unique)`,": "label: 'Atomic memories (' + atomRows.length + ' unique)',",
              "label: `Direct atoms (${directAtoms.length})`,": "label: 'Direct atoms (' + directAtoms.length + ')',",
              "label: `Related atoms (${relatedAtoms.length})`,": "label: 'Related atoms (' + relatedAtoms.length + ')',",
              "label: `Thought context packets (${thoughtRows.length} unique)`,": "label: 'Thought context packets (' + thoughtRows.length + ' unique)',",
              "id: `previous_turns.tool_categories.${category}`,": "id: 'previous_turns.tool_categories.' + category,",
              "label: `Tool categories (${categoryTokens.size} unique)`,": "label: 'Tool categories (' + categoryTokens.size + ' unique)',",
              "`  const inContextRows = [\\n": "`  const inContextRows: ContextWindowRow[] = [\\n",
              "{ id: 'system_tools', label: 'System tools', tokens: systemToolTokens, active: systemToolTokens > 0, children: systemToolChildren }": "{ id: 'system_tools', label: 'System tools', tokens: latestToolSchemaTokens, active: latestToolSchemaTokens > 0, children: systemToolChildren }",
              "`    { id: 'compaction_trigger', label: 'Compaction trigger', tokens: Math.max(0, input.compactionTriggerTokens), percentLabel: 'trigger', outOfBand: true },\\n`,": "`      { id: 'compaction_trigger', label: 'Compaction trigger', tokens: compactionTriggerTokens, active: false, includedInContext: false, outOfBand: true, percentBasis: 'window', percentLabel: 'trigger' },\\n`,",
              "`    { id: 'compaction_trigger', label: 'Model compaction trigger', tokens: Math.max(0, input.compactionTriggerTokens), percentLabel: 'trigger', outOfBand: true },\\n`);": "`      { id: 'compaction_trigger', label: 'Model compaction trigger', tokens: compactionTriggerTokens, active: false, includedInContext: false, outOfBand: true, percentBasis: 'window', percentLabel: 'trigger' },\\n`);",
              "`    { id: 'total_thread_tokens', label: 'Total thread tokens', tokens: totalThreadTokens, percentLabel: 'total', outOfBand: true },\\n`,": "`      { id: 'total_thread_tokens', label: 'Total thread tokens', tokens: totalThreadTokens, active: totalThreadTokens > 0, includedInContext: false, outOfBand: true, percentLabel: 'total' },\\n`,",
              "`    { id: 'total_thread_tokens', label: 'Stored thread footprint', tokens: totalThreadTokens, percentLabel: 'stored', outOfBand: true },\\n`);": "`      { id: 'total_thread_tokens', label: 'Stored thread footprint', tokens: totalThreadTokens, active: totalThreadTokens > 0, includedInContext: false, outOfBand: true, percentLabel: 'stored' },\\n`);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected patch-script fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/apply-thread-context-window-patch.mjs
      - name: Apply patch
        shell: bash
        run: |
          set +e
          node scripts/apply-thread-context-window-patch.mjs
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- current context-window source anchors ---'
            grep -n -B 8 -A 35 "inContextRows" src/gateway/routes/chat.router.ts || true
            grep -n -B 8 -A 30 "const session = getSession(id)" src/gateway/routes/chat.router.ts | tail -80 || true
            echo '--- partial patch diff ---'
            git diff -- src/runtime/prompt-manifest.ts src/providers/model-usage.ts src/agents/ollama-client.ts src/gateway/routes/chat.router.ts web-ui/src/context-window-live-tracking.js || true
            exit "$status"
          fi
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-thread-context-window-patch.mjs
          rm .github/workflows/apply-thread-context-window-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(context-window): track full thread context"
          git push origin HEAD:fix/context-window-live-tracking-ui

# One-shot workflow: it deletes itself after applying the source patch.
