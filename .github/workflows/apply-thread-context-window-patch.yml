name: Apply thread context window patch

on:
  push:
    branches:
      - fix/context-window-live-tracking-ui
    paths:
      - scripts/apply-thread-context-window-patch.mjs
      - .github/workflows/apply-thread-context-window-patch.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-thread-context-window-patch.mjs
      - .github/workflows/apply-thread-context-window-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-window-live-tracking-ui
          fetch-depth: 0
      - name: Repair one-shot patch quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-thread-context-window-patch.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "const id = `thought:${threadKey}`;": "const id = 'thought:' + threadKey;",
              "label: `Atomic memories (${atomRows.length} unique)`,": "label: 'Atomic memories (' + atomRows.length + ' unique)',",
              "label: `Direct atoms (${directAtoms.length})`,": "label: 'Direct atoms (' + directAtoms.length + ')',",
              "label: `Related atoms (${relatedAtoms.length})`,": "label: 'Related atoms (' + relatedAtoms.length + ')',",
              "label: `Thought context packets (${thoughtRows.length} unique)`,": "label: 'Thought context packets (' + thoughtRows.length + ' unique)',",
              "id: `previous_turns.tool_categories.${category}`,": "id: 'previous_turns.tool_categories.' + category,",
              "label: `Tool categories (${categoryTokens.size} unique)`,": "label: 'Tool categories (' + categoryTokens.size + ' unique)',",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected patch-script fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/apply-thread-context-window-patch.mjs
      - name: Apply patch
        run: node scripts/apply-thread-context-window-patch.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-thread-context-window-patch.mjs
          rm .github/workflows/apply-thread-context-window-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(context-window): track full thread context"
          git push origin HEAD:fix/context-window-live-tracking-ui

# One-shot workflow: it deletes itself after applying the source patch.
