name: Temporary Browser Site Cache Verification

on:
  push:
    branches:
      - review/bound-browser-site-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-bound-browser-site-cache.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Browser site cache contract
        run: node scripts/test-browser-site-cache-contract.mjs
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-bound-browser-site-cache.py .github/workflows/tmp-browser-site-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Bound browser site knowledge cache' -m 'Expire cached site knowledge entries instead of leaving stale hostname keys resident forever, and cap the in-memory hostname cache while preserving the existing 30-second freshness behavior.'
          git push origin HEAD:review/bound-browser-site-cache
