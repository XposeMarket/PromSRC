name: Temporary Question model extraction

on:
  push:
    branches:
      - agent/chat-question-model

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-question-model
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract canonical Question model
        run: node scripts/refactor-chat-question-model.mjs
      - name: Syntax-check extracted model
        run: node --check web-ui/src/features/chat/questions/model.js
      - name: Remove temporary extraction machinery
        run: rm .github/workflows/tmp-chat-question-model.yml scripts/refactor-chat-question-model.mjs
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(chat): extract Question model"
          git push origin HEAD:agent/chat-question-model
