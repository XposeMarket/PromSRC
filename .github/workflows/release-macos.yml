# Compatibility entry point: all publication uses the same tag validation,
# regression gate, updater assets and prerelease rules as the primary pipeline.
# macOS builds are skipped unless all signing/notarization secrets exist.
name: Release macOS (tag pipeline compatibility)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing source tag v<package.json version>; runs the full release pipeline'
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.release_tag }}
    secrets: inherit
