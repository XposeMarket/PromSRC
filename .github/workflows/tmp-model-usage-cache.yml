name: Temporary Model Usage Cache Verification

on:
  push:
    branches:
      - review/bound-model-usage-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: python3 scripts/tmp-bound-model-usage-cache.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Model usage incremental/history regression
        run: npx tsx src/providers/model-usage.regression.ts
      - name: Model usage cache contract
        run: node scripts/test-model-usage-cache-contract.mjs
      - name: Brain usage regression
        run: npx tsx src/gateway/brain/brain-usage.regression.ts
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-bound-model-usage-cache.py .github/workflows/tmp-model-usage-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Bound resident model usage cache' -m 'Keep only bounded calibration state and an event count resident in the gateway; materialize lifetime and per-session model usage from the authoritative JSONL only when an explicit historical query needs it.'
          git push origin HEAD:review/bound-model-usage-cache
