name: Storage layout contract

on:
  pull_request:
    paths:
      - 'src/runtime/storage-layout.ts'
      - 'src/runtime/storage-layout.regression.ts'
      - 'src/runtime/storage-ownership.regression.ts'
      - 'src/runtime/storage-migration.ts'
      - 'src/runtime/storage-migration-cli.ts'
      - 'src/runtime/storage-migration.regression.ts'
      - 'scripts/test-retired-firstgen-namespace.mjs'
      - 'src/config/**'
      - 'src/skills/**'
      - 'src/extensions/**'
      - 'src/gateway/**'
      - 'src/scheduler.ts'
      - 'electron/**'
      - 'scripts/**migration**'
      - 'scripts/test-storage-layout-electron-contract.mjs'
      - '.github/workflows/storage-layout-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/runtime/storage-layout.ts'
      - 'src/runtime/storage-layout.regression.ts'
      - 'src/runtime/storage-ownership.regression.ts'
      - 'src/runtime/storage-migration.ts'
      - 'src/runtime/storage-migration-cli.ts'
      - 'src/runtime/storage-migration.regression.ts'
      - 'scripts/test-retired-firstgen-namespace.mjs'
      - 'src/config/**'
      - 'src/skills/**'
      - 'src/extensions/**'
      - 'src/gateway/**'
      - 'src/scheduler.ts'
      - 'electron/**'
      - 'scripts/**migration**'
      - 'scripts/test-storage-layout-electron-contract.mjs'
      - '.github/workflows/storage-layout-contract.yml'

jobs:
  storage-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Storage layout regression
        run: npx --no-install tsx src/runtime/storage-layout.regression.ts
      - name: Storage ownership regression
        run: npx --no-install tsx src/runtime/storage-ownership.regression.ts
      - name: Storage migration regression
        run: npx --no-install tsx src/runtime/storage-migration.regression.ts
      - name: Retired namespace regression
        run: node scripts/test-retired-firstgen-namespace.mjs
      - name: Minimal workspace regression
        run: npx --no-install tsx src/config/public-workspace.regression.ts
      - name: Redo onboarding preservation regression
        run: npx --no-install tsx src/gateway/onboarding/redo-onboarding.regression.ts
      - name: Legacy config portability regression
        run: npx --no-install tsx src/config/config-path-portability.regression.ts
      - name: Canonical config activation regression
        run: npx --no-install tsx src/config/config-storage-layout.regression.ts
      - name: Electron storage activation contract
        run: node scripts/test-storage-layout-electron-contract.mjs
      - name: Backend typecheck
        run: npx --no-install tsc --noEmit
