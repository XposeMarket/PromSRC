name: Storage layout contract

on:
  pull_request:
    paths:
      - 'src/runtime/storage-layout.ts'
      - 'src/runtime/storage-layout.regression.ts'
      - 'src/runtime/storage-ownership.regression.ts'
      - 'src/runtime/storage-migration.ts'
      - 'src/runtime/storage-migration-cli.ts'
      - 'src/runtime/storage-migration.regression.ts'
      - 'src/config/**'
      - 'src/skills/**'
      - 'src/extensions/**'
      - 'src/gateway/**'
      - 'electron/**'
      - 'scripts/**migration**'
      - '.github/workflows/storage-layout-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/runtime/storage-layout.ts'
      - 'src/runtime/storage-layout.regression.ts'
      - 'src/runtime/storage-ownership.regression.ts'
      - 'src/runtime/storage-migration.ts'
      - 'src/runtime/storage-migration-cli.ts'
      - 'src/runtime/storage-migration.regression.ts'
      - 'src/config/**'
      - 'src/skills/**'
      - 'src/extensions/**'
      - 'src/gateway/**'
      - 'electron/**'
      - 'scripts/**migration**'
      - '.github/workflows/storage-layout-contract.yml'

jobs:
  storage-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Storage layout regression
        run: npx --no-install tsx src/runtime/storage-layout.regression.ts
      - name: Storage ownership regression
        run: npx --no-install tsx src/runtime/storage-ownership.regression.ts
      - name: Storage migration regression
        run: npx --no-install tsx src/runtime/storage-migration.regression.ts
      - name: Backend typecheck
        run: npx --no-install tsc --noEmit
