name: Apply merged regression fixes

on:
  push:
    branches:
      - codex/fix-mobile-recovery-trace-dedupe

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply targeted fixes
        run: node scripts/automation-apply-merged-regression-fixes.mjs
      - name: Regenerate Web artifacts
        run: npm run sync:web-ui
      - name: Verify focused regressions
        run: |
          node scripts/test-mobile-background-trace-merge.mjs
          npx --no-install tsx src/gateway/audit/materializer.utf8-boundary.regression.ts
          node scripts/test-background-agent-stream-ui.mjs
          npx --no-install tsx src/gateway/audit/materializer.regression.ts
          npm run check:web-ui
          git diff --check
      - name: Commit fix and remove one-off automation
        run: |
          rm -f .github/workflows/automation-apply-merged-regression-fixes.yml scripts/automation-apply-merged-regression-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make recovery and audit streaming boundary-safe"
          git push origin HEAD:codex/fix-mobile-recovery-trace-dedupe
