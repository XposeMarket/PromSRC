name: Temporary corrected desktop composer preview

on:
  push:
    branches:
      - agent/chat-desktop-composer-component
    paths:
      - .github/workflows/tmp-chat-composer-preview-fix.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-desktop-composer-component
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct composer preview
        run: node scripts/fix-desktop-composer-preview.mjs
      - name: Syntax-check preview module
        run: node --check web-ui/src/features/chat/composer/desktop-composer.js
      - name: Commit corrected preview
        run: |
          rm scripts/fix-desktop-composer-preview.mjs
          rm .github/workflows/tmp-chat-composer-preview-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): correct desktop composer staging"
          git push origin HEAD:agent/chat-desktop-composer-component
