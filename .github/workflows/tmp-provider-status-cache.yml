name: Temporary Provider Status Cache Verification

on:
  push:
    branches:
      - review/scope-provider-status-cache

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited fix
        run: |
          python3 scripts/tmp-scope-provider-status-cache.py
          python3 scripts/tmp-provider-status-keyed-map.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Provider status cache regression
        run: npx tsx src/gateway/provider-status.regression.ts
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-scope-provider-status-cache.py scripts/tmp-provider-status-keyed-map.py .github/workflows/tmp-provider-status-cache.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Scope and expire provider status cache' -m 'Key provider health by provider/account/config identity, enforce the advertised TTL, preserve concurrent identity results, and run a cheap periodic refresh so provider switches are detected without hammering provider endpoints.'
          git push origin HEAD:review/scope-provider-status-cache
