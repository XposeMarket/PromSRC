name: Temporary PR 153 repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'maintenance: apply PR 153 reasoning fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PR 153 and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/desktop-reasoning-summary-stream main
          git checkout -B fix/desktop-reasoning-summary-stream origin/fix/desktop-reasoning-summary-stream
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r"if \(isDesktopProgressNarration\(chunk\)\) setDesktopLiveProgressNarration\(streamState, chunk, (?P<cb>appendLiveTrace|appendTrace)\);\s*"
              r"else appendDesktopReasoningSummary\(streamState, chunk, (?P=cb)\);"
          )

          def patch_desktop(path_str):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = 0
              def replace(match):
                  nonlocal count
                  count += 1
                  cb = match.group('cb')
                  return (
                      "// reasoning_summary is already an explicit user-safe progress channel.\n"
                      "              // Treat every transport delta as part of the single replaceable status slot;\n"
                      "              // classifying individual chunks leaks markdown/token boundaries into the UI.\n"
                      f"              setDesktopLiveProgressNarration(streamState, chunk, {cb});"
                  )
              updated = pattern.sub(replace, text)
              if count < 4:
                  raise SystemExit(f'{path_str}: expected at least 4 explicit-summary branches, replaced {count}')
              path.write_text(updated, encoding='utf-8')

          patch_desktop('web-ui/src/pages/ChatPage.js')
          patch_desktop('generated/public-web-ui/static/pages/ChatPage.js')

          test = Path('scripts/test-desktop-reasoning-summary-stream.mjs')
          test.write_text(r'''import fs from 'node:fs';
import assert from 'node:assert/strict';

const desktop = fs.readFileSync(new URL('../web-ui/src/pages/ChatPage.js', import.meta.url), 'utf8');
const desktopGenerated = fs.readFileSync(new URL('../generated/public-web-ui/static/pages/ChatPage.js', import.meta.url), 'utf8');
const mobile = fs.readFileSync(new URL('../web-ui/src/mobile/mobile-pages.js', import.meta.url), 'utf8');
const mobileGenerated = fs.readFileSync(new URL('../generated/public-web-ui/static/mobile/mobile-pages.js', import.meta.url), 'utf8');

const legacySplit = /if \(isDesktopProgressNarration\(chunk\)\) setDesktopLiveProgressNarration\(streamState, chunk, (appendLiveTrace|appendTrace)\);\s*else appendDesktopReasoningSummary\(streamState, chunk, \1\);/g;
assert.equal([...desktop.matchAll(legacySplit)].length, 0, 'desktop source must not classify explicit reasoning_summary transport chunks independently');
assert.equal([...desktopGenerated.matchAll(legacySplit)].length, 0, 'desktop generated mirror must not classify explicit reasoning_summary transport chunks independently');

const directPattern = /setDesktopLiveProgressNarration\(streamState, chunk, (appendLiveTrace|appendTrace)\);/g;
assert.ok([...desktop.matchAll(directPattern)].length >= 4, 'desktop source should route all explicit reasoning summaries through the replaceable progress slot');
assert.ok([...desktopGenerated.matchAll(directPattern)].length >= 4, 'desktop generated mirror should route all explicit reasoning summaries through the replaceable progress slot');

for (const [label, text] of [['mobile source', mobile], ['mobile generated', mobileGenerated]]) {
  assert.match(
    text,
    /reasoning_summary[^]*?explicit user-safe progress channel[^]*?_setMobileLiveProgressNarration\(message, chunk\)/,
    `${label}: explicit reasoning summaries must remain in the replaceable progress slot`,
  );
}

console.log('desktop reasoning-summary stream parity regression passed');
''', encoding='utf-8')

          workflow = Path('.github/workflows/pr-regression.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          step = "      - name: Verify desktop reasoning summary streaming\n        run: node scripts/test-desktop-reasoning-summary-stream.mjs\n"
          if 'Verify desktop reasoning summary streaming' not in workflow_text:
              if not workflow_text.endswith('\n'):
                  workflow_text += '\n'
              workflow_text += step
              workflow.write_text(workflow_text, encoding='utf-8')

          old_helper = Path('.github/workflows/temp-desktop-reasoning-summary-fix.yml')
          if old_helper.exists():
              old_helper.unlink()
          PY
          git add web-ui/src/pages/ChatPage.js generated/public-web-ui/static/pages/ChatPage.js scripts/test-desktop-reasoning-summary-stream.mjs .github/workflows/pr-regression.yml
          git add -u .github/workflows/temp-desktop-reasoning-summary-fix.yml || true
          git commit -m "fix: clean desktop reasoning summary streaming"
          git push origin HEAD:fix/desktop-reasoning-summary-stream

          git fetch origin main
          git checkout -B maintenance-main origin/main
          git rm .github/workflows/temp-fix-pr153.yml
          git commit -m "maintenance: remove PR 153 repair helper"
          git push origin HEAD:main
