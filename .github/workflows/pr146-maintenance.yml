name: PR 146 maintenance helper

on:
  pull_request_target:
    types: [edited, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 146 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/remove-retired-firstgen-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-retired-firstgen-compat
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove retired first-generation compatibility
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          # Remove the ancient startup copy/migration path completely.
          def clean_config(s):
              s = re.sub(
                  r"function migrateLegacyDir\(legacyDir: string, targetDir: string\): void \{.*?\nmigrateLegacyData\(\);\n\n(?=// ── Config & workspace directory resolution)",
                  "",
                  s,
                  flags=re.S,
              )
              s = re.sub(
                  r"\n  // ── \.localclaw → \.prometheus migration ─+\n.*?(?=\n  // ── Stale Windows paths)",
                  "\n",
                  s,
                  flags=re.S,
              )
              return s
          edit('src/config/config.ts', clean_config)

          # Remove retired source from the old migration service while retaining Hermes/OpenClaw/custom.
          def clean_migration_service(s):
              s = s.replace("export type MigrationSourceKind = 'hermes' | 'openclaw' | 'localclaw' | 'custom';", "export type MigrationSourceKind = 'hermes' | 'openclaw' | 'custom';")
              s = re.sub(r"\n\s*localclaw: 'LocalClaw',", "", s)
              s = re.sub(r"\n\s*if \(path\.basename\(root\)\.toLowerCase\(\)\.includes\('localclaw'\)\) return 'localclaw';", "", s)
              s = re.sub(r"\n\s*\{ kind: 'localclaw', root: path\.join\(home, '\.localclaw'\) \},", "", s)
              s = re.sub(r"\n\s*\{ kind: 'localclaw', root: path\.join\(cwd, '\.localclaw'\) \},", "", s)
              s = s.replace("No Hermes, OpenClaw, or LocalClaw source was found.", "No Hermes or OpenClaw source was found.")
              return s
          edit('src/gateway/migration/migration-service.ts', clean_migration_service)

          # Remove the retired conversation/setup adapter identity.
          edit('src/gateway/imports/import-types.ts', lambda s: re.sub(r"\n\s*\| 'localclaw-local'", "", s))

          def clean_discovery(s):
              s = re.sub(r"\n\s*if \(adapter === 'localclaw-local'.*?return true;", "", s)
              s = re.sub(
                  r"\n\s*candidate\(\{\n\s*id: 'localclaw-conversations'.*?\n\s*\}\),",
                  "",
                  s,
                  flags=re.S,
              )
              s = re.sub(
                  r"\n\s*candidate\(\{\n\s*id: 'localclaw-setup'.*?\n\s*\}\),",
                  "",
                  s,
                  flags=re.S,
              )
              return s
          edit('src/gateway/imports/import-discovery.ts', clean_discovery)

          def clean_adapters(s):
              s = s.replace("              : context.requestedAdapter === 'openclaw-local' ? 'openclaw'\n                : context.requestedAdapter === 'localclaw-local' ? 'localclaw' : 'generic';",
                            "              : context.requestedAdapter === 'openclaw-local' ? 'openclaw' : 'generic';")
              s = re.sub(r"\n\s*if \(lower\.includes\('localclaw'\)\) return \{ adapter: 'localclaw-local', provider: 'localclaw' \};", "", s)
              s = s.replace(" : lower.includes('openclaw') ? 'openclaw' : lower.includes('localclaw') ? 'localclaw' : lower.includes('claude') ? 'claude' : 'generic';",
                            " : lower.includes('openclaw') ? 'openclaw' : lower.includes('claude') ? 'claude' : 'generic';")
              return s
          edit('src/gateway/imports/import-adapters.ts', clean_adapters)

          # Onboarding UI: Hermes/OpenClaw remain supported; retired source disappears.
          def clean_panel(s):
              s = s.replace("source?.kind === 'openclaw' ? 'OpenClaw' : source?.kind === 'localclaw' ? 'LocalClaw' : 'Custom'", "source?.kind === 'openclaw' ? 'OpenClaw' : 'Custom'")
              s = s.replace('Hermes, OpenClaw, or LocalClaw data', 'Hermes or OpenClaw data')
              s = s.replace('No Hermes, OpenClaw, or LocalClaw setup', 'No Hermes or OpenClaw setup')
              return s
          edit('web-ui/src/onboarding/migration-panel.js', clean_panel)
          edit('generated/public-web-ui/static/onboarding/migration-panel.js', clean_panel)

          # Remove retired import-source branding from desktop/mobile UI copies.
          def clean_brand_map(s):
              s = re.sub(r"\n\s*localclaw: \{ key: 'localclaw'.*?\},", "", s)
              s = re.sub(r"\n\s*'localclaw-local': \{ key: 'localclaw'.*?\},", "", s)
              return s
          for f in [
              'web-ui/src/mobile/mobile-shell.js',
              'generated/public-web-ui/static/mobile/mobile-shell.js',
              'web-ui/index.html',
              'generated/public-web-ui/index.html',
          ]:
              edit(f, clean_brand_map)

          # Rename stale first-generation runtime tuning names to Prometheus-native names.
          for f in [
              'src/agents/reactor.ts',
              'src/gateway/context/model-context.ts',
              'src/gateway/session.ts',
              'src/gateway/tasks/background-task-runner.ts',
          ]:
              edit(f, lambda s: s.replace('LOCALCLAW_', 'PROMETHEUS_').replace('LocalClaw sandbox', 'Prometheus sandbox').replace('LocalClaw execute engine', 'Prometheus execute engine'))

          # Remove obsolete container home path creation.
          edit('Dockerfile', lambda s: '\n'.join(line for line in s.splitlines() if '.localclaw' not in line) + ('\n' if s.endswith('\n') else ''))

          # Remove obsolete source assets when present.
          for f in [
              'web-ui/src/assets/import-sources/localclaw.webp',
              'generated/public-web-ui/static/assets/import-sources/localclaw.webp',
          ]:
              p = Path(f)
              if p.exists():
                  p.unlink()

          # Architecture notes should describe the retired era generically.
          for p in Path('workspace/self').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              n = s.replace('LocalClaw', 'Prometheus v0').replace('localclaw', 'prometheus-v0').replace('LOCALCLAW_', 'PROMETHEUS_')
              if n != s:
                  p.write_text(n, encoding='utf-8')

          # Remove temporary scaffolding from this feature branch so the final tree is clean.
          for f in ['.github/workflows/pr146-retired-compat-cleanup.yml', '.github/workflows/pr146-maintenance.yml']:
              p = Path(f)
              if p.exists():
                  p.unlink()

          # Active product code must contain no retired namespace afterward.
          blocked = []
          for raw in Path('.').rglob('*'):
              if not raw.is_file():
                  continue
              rel = raw.as_posix()
              if rel.startswith('.git/') or rel.startswith('workspace/temp/'):
                  continue
              try:
                  text = raw.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'localclaw' in text.lower():
                  blocked.append(rel)
          if blocked:
              raise SystemExit('retired namespace remains in tracked text:\n' + '\n'.join(sorted(blocked)))
          PY

          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes produced.'
            exit 1
          fi
          git config user.name 'Prometheus Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: remove retired first-generation Prometheus compatibility'
          git push origin HEAD:refactor/remove-retired-firstgen-compat
