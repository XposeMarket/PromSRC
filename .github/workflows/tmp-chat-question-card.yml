name: Temporary Question Card extraction

on:
  push:
    branches:
      - agent/chat-question-card

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-question-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract Question Card renderer
        run: node scripts/refactor-chat-question-card.mjs
      - name: Syntax-check extracted renderer
        run: node --check web-ui/src/features/chat/questions/QuestionCard.js
      - name: Remove temporary extraction machinery
        run: rm .github/workflows/tmp-chat-question-card.yml scripts/refactor-chat-question-card.mjs
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(chat): extract Question Card component"
          git push origin HEAD:agent/chat-question-card
