name: Temporary desktop reasoning summary parity patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-reasoning-summary-stream
          fetch-depth: 0
      - name: Apply desktop reasoning summary parity fix
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('web-ui/src/pages/ChatPage.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"if \(isDesktopProgressNarration\(chunk\)\) setDesktopLiveProgressNarration\(streamState, chunk, (?P<cb>appendLiveTrace|appendTrace)\);\s*"
              r"else appendDesktopReasoningSummary\(streamState, chunk, (?P=cb)\);"
          )
          replacement_count = 0

          def replace(match):
              global replacement_count
              replacement_count += 1
              cb = match.group('cb')
              return (
                  "// reasoning_summary is already an explicit user-safe progress channel.\n"
                  "              // Treat every transport delta as part of the single replaceable status slot;\n"
                  "              // classifying individual chunks leaks markdown/token boundaries into the UI.\n"
                  f"              setDesktopLiveProgressNarration(streamState, chunk, {cb});"
              )

          updated = pattern.sub(replace, text)
          if replacement_count < 2:
              raise SystemExit(f'Expected at least 2 desktop reasoning-summary branches, replaced {replacement_count}')
          if updated == text:
              raise SystemExit('Desktop ChatPage was not changed')
          path.write_text(updated, encoding='utf-8')

          test = Path('scripts/test-desktop-reasoning-summary-stream.mjs')
          test.write_text(r'''import fs from 'node:fs';
import assert from 'node:assert/strict';

const desktop = fs.readFileSync(new URL('../web-ui/src/pages/ChatPage.js', import.meta.url), 'utf8');
const mobile = fs.readFileSync(new URL('../web-ui/src/mobile/mobile-pages.js', import.meta.url), 'utf8');

const legacySplit = /if \(isDesktopProgressNarration\(chunk\)\) setDesktopLiveProgressNarration\(streamState, chunk, (appendLiveTrace|appendTrace)\);\s*else appendDesktopReasoningSummary\(streamState, chunk, \1\);/g;
assert.equal([...desktop.matchAll(legacySplit)].length, 0, 'desktop must not classify explicit reasoning_summary transport chunks independently');

const desktopDirect = [...desktop.matchAll(/setDesktopLiveProgressNarration\(streamState, chunk, (appendLiveTrace|appendTrace)\);/g)].length;
assert.ok(desktopDirect >= 2, 'desktop should route explicit reasoning summaries through the replaceable progress slot');

assert.match(
  mobile,
  /reasoning_summary[^]*?explicit user-safe progress channel[^]*?_setMobileLiveProgressNarration\(message, chunk\)/,
  'mobile parity guard: explicit reasoning summaries remain in the replaceable progress slot',
);

console.log('desktop reasoning-summary stream parity regression passed');
''', encoding='utf-8')
      - name: Run targeted regression
        run: node scripts/test-desktop-reasoning-summary-stream.mjs
      - name: Remove temporary workflow and commit fix
        run: |
          git rm .github/workflows/temp-desktop-reasoning-summary-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-ui/src/pages/ChatPage.js scripts/test-desktop-reasoning-summary-stream.mjs
          git commit -m "fix: clean desktop reasoning summary streaming"
          git push origin HEAD:fix/desktop-reasoning-summary-stream
