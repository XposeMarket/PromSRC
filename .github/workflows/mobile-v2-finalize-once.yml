name: Mobile V2 finalize once

on:
  push:
    branches:
      - mobile-v2-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-v2-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch clean Mobile V2 gateway route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gateway/core/server.ts')
          text = path.read_text(encoding='utf-8')

          old_cache = "pathname === '/' || pathname === '/index.html' || pathname === '/mobile' || pathname.startsWith('/mobile/')"
          new_cache = "pathname === '/' || pathname === '/index.html' || pathname === '/mobile' || pathname.startsWith('/mobile/') || pathname === '/mobile-v2' || pathname.startsWith('/mobile-v2/')"
          if old_cache in text:
              text = text.replace(old_cache, new_cache, 1)
          elif new_cache not in text:
              raise SystemExit('Could not find mobile cache-control route guard')

          old_route = """  } else if (pathname === '/mobile' || pathname.startsWith('/mobile/')) {
            // Mobile has a dedicated document so it never parses the desktop shell or
            // desktop styles. Keep index.html as a source/distribution rollback path.
            push(webUiRoot, 'mobile.html');
            push(webUiRoot, 'index.html');
          """
          new_route = """  } else if (pathname === '/mobile-v2' || pathname.startsWith('/mobile-v2/')) {
            // Mobile V2 is a parallel client. Keep it isolated from legacy /mobile so
            // the existing app remains the rollback path until parity is proven.
            push(webUiRoot, 'mobile-v2.html');
          } else if (pathname === '/mobile' || pathname.startsWith('/mobile/')) {
            // Mobile has a dedicated document so it never parses the desktop shell or
            // desktop styles. Keep index.html as a source/distribution rollback path.
            push(webUiRoot, 'mobile.html');
            push(webUiRoot, 'index.html');
          """
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit('Could not find legacy mobile static route block')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate public web UI
        run: npm run sync:web-ui

      - name: Commit finalized route and generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gateway/core/server.ts generated/public-web-ui
          if git diff --cached --quiet; then
            echo "Mobile V2 finalization already applied."
            exit 0
          fi
          git commit -m "feat(mobile-v2): expose parallel route and sync public build"
          git push origin HEAD:mobile-v2-foundation
