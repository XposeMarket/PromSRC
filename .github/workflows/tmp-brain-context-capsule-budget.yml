name: Temporary Brain Context Capsule Budget Verification

on:
  push:
    branches:
      - review/brain-context-capsule-budget

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/tmp-brain-context-capsule-budget.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Brain continuity regression
        run: npx tsx src/gateway/brain/brain-continuity.regression.ts
      - name: Prompt context regression
        run: npm run test:prompt-cache
      - name: Commit verified changes and remove temporary harness
        run: |
          rm -f scripts/tmp-brain-context-capsule-budget.py .github/workflows/tmp-brain-context-capsule-budget.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Bound oversized Brain context capsules' -m 'Count the Brain context header inside maxChars and truncate an oversized selected capsule instead of letting one verbose packet suppress all temporary Thought continuity for the turn.'
          git push origin HEAD:review/brain-context-capsule-budget
