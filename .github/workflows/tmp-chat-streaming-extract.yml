name: Temporary chat streaming extraction

on:
  push:
    branches:
      - agent/chat-streaming-module
    paths:
      - .github/workflows/tmp-chat-streaming-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-streaming-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract stream renderer ownership
        run: node scripts/refactor-chat-streaming-module.mjs
      - name: Verify extracted module
        run: node scripts/test-chat-streaming-render-coalescer.mjs
      - name: Commit transformed source
        run: |
          rm scripts/refactor-chat-streaming-module.mjs
          rm .github/workflows/tmp-chat-streaming-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): extract stream render coalescer"
          git push origin HEAD:agent/chat-streaming-module
