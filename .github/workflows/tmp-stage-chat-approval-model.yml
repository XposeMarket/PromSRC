name: Temporary approval model staging

on:
  push:
    branches:
      - agent/chat-approval-model
    paths:
      - .github/workflows/tmp-stage-chat-approval-model.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-approval-model
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage approval model
        run: node scripts/stage-chat-approval-model.mjs
      - name: Syntax-check model
        run: node --check web-ui/src/features/chat/approvals/model.js
      - name: Commit staging module
        run: |
          rm scripts/stage-chat-approval-model.mjs
          rm .github/workflows/tmp-stage-chat-approval-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): stage approval model"
          git push origin HEAD:agent/chat-approval-model
