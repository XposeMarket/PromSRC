name: Temporary approval model wiring

on:
  push:
    branches:
      - agent/chat-approval-model
    paths:
      - .github/workflows/tmp-chat-approval-model-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-approval-model
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire approval model ownership
        run: node scripts/refactor-chat-approval-model.mjs
      - name: Verify approval model
        run: node scripts/test-chat-approval-model.mjs
      - name: Commit transformed source
        run: |
          rm scripts/refactor-chat-approval-model.mjs
          rm .github/workflows/tmp-chat-approval-model-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(chat): extract approval model"
          git push origin HEAD:agent/chat-approval-model
