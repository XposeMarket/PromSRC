name: Temporary Full Atomic Memory Corpus Verification

on:
  push:
    branches:
      - review/atomic-memory-project-context

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh current corpus contract
        run: python3 scripts/tmp-refresh-memory-atom-corpus.py
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Full atomic-memory regression
        run: npx tsx src/gateway/memory-index/memory-atoms.regression.ts
      - name: Commit refreshed permanent regression
        run: |
          rm -f scripts/tmp-refresh-memory-atom-corpus.py .github/workflows/tmp-refresh-memory-atom-corpus.yml
          git config user.name 'prometheus-audit-bot'
          git config user.email 'prometheus-audit-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh atomic memory corpus regression' -m 'Update the corpus count and add retrieval coverage for the newest durable Prometheus self-edit memory so the full atomic-memory suite validates the current MEMORY.md again.'
          git push origin HEAD:review/atomic-memory-project-context
