name: Context ledger finalize

on:
  push:
    branches:
      - fix/context-window-live-tracking-ui
    paths:
      - .github/workflows/context-ledger-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-window-live-tracking-ui
          fetch-depth: 0
      - name: Inspect provider usage handoff
        shell: bash
        run: |
          echo '--- turnProviderUsage references ---'
          grep -R -n -C 8 "turnProviderUsage" src/gateway src/providers src/agents | head -500 || true
          echo '--- lastContextCall references ---'
          grep -R -n -C 10 "lastContextCall" src/gateway src/providers src/agents | head -500 || true
          echo '--- aggregate usage references ---'
          grep -R -n -C 10 "aggregateSessionModelUsage\|summarizeTurnProviderUsage\|getLastTurnUsageTelemetry" src/gateway src/providers src/agents | head -500 || true
      - name: Bump runtime prompt manifest schema version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/runtime/prompt-manifest.ts')
          text = path.read_text(encoding='utf-8')
          old = 'export const RUNTIME_PROMPT_MANIFEST_VERSION = 5;'
          new = 'export const RUNTIME_PROMPT_MANIFEST_VERSION = 6;'
          if old not in text:
              raise SystemExit('runtime prompt manifest version drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/context-ledger-finalize.yml
      - name: Commit manifest version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(prompt-manifest): version dynamic context telemetry"
          git push origin HEAD:fix/context-window-live-tracking-ui
