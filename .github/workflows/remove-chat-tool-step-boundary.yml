name: Remove chat tool-step boundary

on:
  push:
    branches:
      - fix/remove-chat-tool-step-boundary

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-chat-tool-step-boundary
          fetch-depth: 0

      - name: Remove fixed handleChat tool-round ceiling
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          chat = Path('src/gateway/routes/chat.router.ts')
          text = chat.read_text(encoding='utf-8')

          # This cap was global to handleChat and forced healthy long-running work
          # into synthetic continuation rounds. Prometheus already has progress/stall,
          # repeated-tool, explicit abort, provider, and task-level safety controls.
          text, n = re.subn(
              r"import \{ activeTasks, getMaxToolRounds \} from '../chat/chat-state';",
              "import { activeTasks } from '../chat/chat-state';",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('expected chat-state max-round import not found exactly once')

          text, n = re.subn(
              r"\nconst MAX_TOOL_ROUNDS = getMaxToolRounds\(\);\n\nfunction resolveEffectiveMaxToolRounds\([\s\S]*?\n\}\n\nfunction isResumableExecutionMode\(executionMode: ExecutionMode\): boolean \{[\s\S]*?\n\}\n",
              "\n",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('expected fixed tool-round resolver block not found exactly once')

          old = """  const creativeMode = executionMode === 'interactive' ? getCreativeMode(sessionId) : null;
  const effectiveMaxToolRounds = resolveEffectiveMaxToolRounds(MAX_TOOL_ROUNDS, {
    creativeMode,
    executionMode,
    message,
    sessionId,
  });
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected effective max-round setup once, found {text.count(old)}')
          text = text.replace(old, "  const creativeMode = executionMode === 'interactive' ? getCreativeMode(sessionId) : null;\n", 1)

          text, n = re.subn(
              r"\n  const extendedFileOpRounds = \(\(\) => \{[\s\S]*?\n  \}\)\(\);\n\n  for \(let round = 0; ; round\+\+\) \{\n    if \(round >= effectiveMaxToolRounds\) \{[\s\S]*?\n    \}\n",
              "\n  // Deliberately unbounded by total tool-call count. A productive turn may need\n  // hundreds of tool calls; stop conditions are progress/safety based instead.\n  for (let round = 0; ; round++) {\n",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('expected capped tool loop not found exactly once')

          boundary_start = "  const stepCount = allToolResults.length;\n  console.warn(`[v2] WARN max tool rounds reached (${effectiveMaxToolRounds}) in ${executionMode} mode after ${stepCount} tool result(s).`);"
          start = text.find(boundary_start)
          if start < 0:
              raise SystemExit('max-round terminal block start not found')
          end_marker = "    toolResults: allToolResults,\n  };\n}"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('max-round terminal block end not found')
          end += len(end_marker)
          replacement = """  // Reaching this point means the tool loop exited through a non-cap break path.
  // Never mislabel that as a max-step condition or ask the user to manually continue.
  const text = allToolResults.length > 0
    ? 'Execution stopped before completion. Progress from completed tool calls was preserved.'
    : 'Execution stopped before completion before any tool call finished.';
  const finalTextWithSkillOffer = finalizeSkillGardenerForTurn(text);
  return {
    type: 'execute',
    text: finalTextWithSkillOffer,
    reasoningSummary: normalizeReasoningSummary(allReasoningSummary),
    toolResults: allToolResults,
  };
}"""
          text = text[:start] + replacement + text[end:]

          forbidden = [
              'Reached the turn safety boundary',
              'Hit max steps - continuing next round.',
              'effectiveMaxToolRounds',
              'PROMETHEUS_INTERACTIVE_MAX_TOOL_ROUNDS',
              'PROMETHEUS_BACKGROUND_MAX_TOOL_ROUNDS',
              'PROMETHEUS_PROPOSAL_MAX_TOOL_ROUNDS',
              'PROMETHEUS_TEAM_MAX_TOOL_ROUNDS',
              'PROMETHEUS_AUTONOMOUS_MAX_TOOL_ROUNDS',
              'PROMETHEUS_BRAIN_DREAM_MAX_ROUNDS',
              'PROMETHEUS_BRAIN_THOUGHT_MAX_ROUNDS',
              'PROMETHEUS_FILE_OP_EXTENDED_MAX_ROUNDS',
          ]
          leftovers = [needle for needle in forbidden if needle in text]
          if leftovers:
              raise SystemExit('tool-round cap remnants remain in chat.router.ts: ' + ', '.join(leftovers))
          chat.write_text(text, encoding='utf-8')

          runner = Path('src/gateway/tasks/background-task-runner.ts')
          rtext = runner.read_text(encoding='utf-8')
          dead = """      // Check if handleChat hit its internal step cap
      const hitMaxSteps = /^hit max steps/i.test(lastResultSummary);
      if (hitMaxSteps) {
        appendJournal(taskId, { type: 'status_push', content: 'Round hit max tool steps — continuing.' });
        continue;
      }

"""
          count = rtext.count(dead)
          if count != 1:
              raise SystemExit(f'expected dead max-step continuation shim once, found {count}')
          rtext = rtext.replace(dead, '', 1)
          runner.write_text(rtext, encoding='utf-8')

          regression = Path('scripts/test-unbounded-chat-tool-loop.mjs')
          regression.write_text(r'''import fs from 'node:fs';

const chat = fs.readFileSync('src/gateway/routes/chat.router.ts', 'utf8');
const runner = fs.readFileSync('src/gateway/tasks/background-task-runner.ts', 'utf8');

const forbidden = [
  'Reached the turn safety boundary',
  'Hit max steps - continuing next round.',
  'effectiveMaxToolRounds',
  'getMaxToolRounds',
  'PROMETHEUS_INTERACTIVE_MAX_TOOL_ROUNDS',
  'PROMETHEUS_BACKGROUND_MAX_TOOL_ROUNDS',
  'PROMETHEUS_PROPOSAL_MAX_TOOL_ROUNDS',
  'PROMETHEUS_TEAM_MAX_TOOL_ROUNDS',
  'PROMETHEUS_AUTONOMOUS_MAX_TOOL_ROUNDS',
  'PROMETHEUS_BRAIN_DREAM_MAX_ROUNDS',
  'PROMETHEUS_BRAIN_THOUGHT_MAX_ROUNDS',
  'PROMETHEUS_FILE_OP_EXTENDED_MAX_ROUNDS',
];
for (const needle of forbidden) {
  if (chat.includes(needle)) throw new Error(`fixed chat tool-round cap leaked back in: ${needle}`);
}
if (/hit max steps/i.test(runner)) throw new Error('background runner still special-cases a handleChat max-step result');
if (!chat.includes('for (let round = 0; ; round++)')) throw new Error('chat tool loop is no longer open-ended');
if (!chat.includes('Deliberately unbounded by total tool-call count')) throw new Error('unbounded-loop contract comment missing');
console.log('unbounded chat tool-loop regression passed');
''', encoding='utf-8')
          PY

      - name: Verify unbounded-loop contract
        run: node scripts/test-unbounded-chat-tool-loop.mjs

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Diff sanity
        run: git diff --check

      - name: Commit source fix and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-chat-tool-step-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove fixed chat tool-step boundary'
          git push origin HEAD:fix/remove-chat-tool-step-boundary
