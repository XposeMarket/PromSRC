name: Repair current public web UI sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/current-main-web-ui-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-main-web-ui-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate public web UI mirrors
        run: npm run sync:web-ui
      - name: Commit generated parity repair
        run: |
          set -euo pipefail
          git add generated/public-web-ui
          if git diff --cached --quiet; then
            echo 'Generated mirrors already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync generated public web UI'
          git push origin HEAD:fix/current-main-web-ui-sync
