name: PR 146 maintenance after regression

on:
  workflow_run:
    workflows: ["Pull request regression checks"]
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'refactor/remove-retired-firstgen-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-retired-firstgen-compat
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute scoped cleanup from main helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pr146-maintenance.yml > /tmp/pr146-helper.yml
          python <<'PY'
          from pathlib import Path
          src = Path('/tmp/pr146-helper.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in src:
              raise SystemExit('cleanup body not found')
          block = src.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  break
          script = '\n'.join(lines) + '\n'
          script = script.replace("'.github/workflows/pr146-maintenance.yml']", "'.github/workflows/pr146-maintenance.yml', '.github/workflows/pr146-maintenance-v2.yml']")
          Path('/tmp/pr146-cleanup.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/pr146-cleanup.sh
